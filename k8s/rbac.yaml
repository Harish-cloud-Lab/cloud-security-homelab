apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: homelab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: homelab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: homelab
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: homelab
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io